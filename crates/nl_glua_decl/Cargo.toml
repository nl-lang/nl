[package]
name = "nl_glua_decl"
description = "Generates decl/glua.d.nl, the declarations of Garry's Mod's Lua API, from the wiki data of glua-api-snippets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "glua-decl"
path = "src/main.rs"

[dependencies]
# Checks the output: it must parse, be formatted, and load beside the
# built-in declarations without a diagnostic.
nl_syntax = { path = "../nl_syntax" }
nl_sema = { path = "../nl_sema" }
rowan.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true
