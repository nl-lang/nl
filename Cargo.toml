[workspace]
resolver = "3"
members = ["crates/*"]
# The VM fork, a git submodule.
exclude = ["LuaJIT"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
rowan = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Library code must not panic on input; tests may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
